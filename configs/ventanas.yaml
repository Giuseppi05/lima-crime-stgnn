  v1: grilla de partida (lr 1e-3 y 3e-3; XGBoost 24 combinaciones), tag git v1-resultados
  v2: 'grilla ampliada solo con lr 1e-4 y 3e-4 (48 combinaciones) y XGBoost a 48;
    motivo: en v1 el mejor MAE de validacion llego en las epocas 1-4 (mediana 4 con
    salida residual). Eleccion solo con validacion.'
  v3: 'grilla de v2 y perdida Huber ponderada por distrito (nivel medio de entrenamiento
    x desviacion del log), para alinear el entrenamiento con el MAE en denuncias;
    misma ponderacion para GE, GC1 y GC2; eleccion solo con validacion. NO ADOPTADA:
    empeora el MAE de validacion (GE 30,681 -> 30,846); resultados en results/v3/.'
  v4: 'grilla de la v2 (sin perdida ponderada); los hiperparametros de la ventana
    w se eligen con el MAE de validacion promedio de las ventanas 1..w (seleccion:
    multianual); la ventana 1 y la P como en la v2. Adoptada por una confirmacion
    fuera de muestra dentro de la validacion (9 de 10 pares). Desarrollo en results/experimentos/h1_v4_validacion_multianual/
    (lectura.md); entrenada en la PC de la v2 el 2026-11-22, con la atencion y los
    casos adversos recalculados tras corregir la cache del grafo.'
